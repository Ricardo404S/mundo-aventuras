<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4d96ff"/>
      <stop offset="55%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#ff6b9d"/>
    </linearGradient>
    <linearGradient id="botao" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ce99a"/>
      <stop offset="100%" stop-color="#51cf66"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1b2a6b" flood-opacity="0.35"/>
    </filter>
    <filter id="sombra-leve" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1b2a6b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="628" fill="url(#fundo)"/>

  <!-- bolhas decorativas -->
  <circle cx="90" cy="90" r="140" fill="#ffffff" opacity="0.06"/>
  <circle cx="1120" cy="560" r="180" fill="#ffffff" opacity="0.06"/>
  <circle cx="1050" cy="80" r="60" fill="#ffd93d" opacity="0.25"/>
  <circle cx="140" cy="540" r="90" fill="#ffd93d" opacity="0.15"/>

  <!-- nuvens -->
  <g fill="#ffffff" opacity="0.85" filter="url(#sombra-leve)">
    <g transform="translate(150, 110) scale(0.9)">
      <ellipse cx="0" cy="0" rx="46" ry="26"/>
      <ellipse cx="-34" cy="10" rx="34" ry="20"/>
      <ellipse cx="36" cy="12" rx="38" ry="22"/>
    </g>
    <g transform="translate(1010, 150) scale(0.7)">
      <ellipse cx="0" cy="0" rx="46" ry="26"/>
      <ellipse cx="-34" cy="10" rx="34" ry="20"/>
      <ellipse cx="36" cy="12" rx="38" ry="22"/>
    </g>
  </g>

  <!-- estrelas cintilantes -->
  <g fill="#ffd93d">
    <path d="M1000 300 l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8z"/>
    <path d="M180 300 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z" opacity="0.8"/>
    <path d="M1080 420 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z" opacity="0.7"/>
  </g>

  <!-- cartão central -->
  <g filter="url(#sombra)">
    <rect x="290" y="60" width="620" height="510" rx="42" fill="#ffffff"/>
  </g>

  <!-- badge topo -->
  <g>
    <rect x="410" y="104" width="380" height="44" rx="22" fill="#f3e8ff"/>
    <text x="600" y="133" text-anchor="middle" font-family="DejaVu Sans" font-size="19" font-weight="bold" fill="#7c3aed">✨ JOGO EDUCATIVO PARA CRIANÇAS ✨</text>
  </g>

  <!-- foguete vetorial colorido -->
  <g transform="translate(600, 215)">
    <circle cx="0" cy="0" r="62" fill="#ebf8ff"/>
    <g transform="translate(0, 2)">
      <path d="M-22 14 C-22 -6 -10 -28 0 -40 C10 -28 22 -6 22 14 Z" fill="#ff6b6b"/>
      <path d="M-22 14 C-22 26 -14 36 0 36 C14 36 22 26 22 14 Z" fill="#ffd93d"/>
      <circle cx="0" cy="-4" r="11" fill="#4d96ff" stroke="#ffffff" stroke-width="3"/>
      <path d="M-22 6 L-34 22 L-20 18 Z" fill="#ff6b9d"/>
      <path d="M22 6 L34 22 L20 18 Z" fill="#ff6b9d"/>
      <path d="M-8 36 L0 50 L8 36 Z" fill="#ff9f43"/>
    </g>
  </g>

  <!-- título -->
  <text x="600" y="332" text-anchor="middle" font-family="DejaVu Sans" font-size="52" font-weight="bold" fill="#2d3748">Mundo das</text>
  <text x="600" y="392" text-anchor="middle" font-family="DejaVu Sans" font-size="56" font-weight="bold" fill="#ff6b9d">Aventuras</text>

  <!-- subtítulo -->
  <text x="600" y="438" text-anchor="middle" font-family="DejaVu Sans" font-size="22" fill="#718096">Matemática · Lógica · Inglês · Curiosidades</text>

  <!-- chips (reduzidos para caber) -->
  <g font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#ffffff">
    <rect x="345" y="462" width="152" height="38" rx="19" fill="#6bcb77"/>
    <text x="421" y="487" text-anchor="middle">1ª à 3ª série</text>
    <rect x="524" y="462" width="152" height="38" rx="19" fill="#4d96ff"/>
    <text x="600" y="487" text-anchor="middle">Sem anúncios</text>
    <rect x="703" y="462" width="152" height="38" rx="19" fill="#a78bfa"/>
    <text x="779" y="487" text-anchor="middle">Painel dos pais</text>
  </g>

  <!-- botão CTA -->
  <g filter="url(#sombra-leve)">
    <rect x="410" y="522" width="380" height="58" rx="18" fill="url(#botao)"/>
  </g>
  <text x="600" y="560" text-anchor="middle" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#ffffff">COMECE A JOGAR AGORA ➔</text>

  <!-- decorações vetoriais coloridas nas bordas -->
  <!-- arco-íris -->
  <g transform="translate(115, 420)" fill="none" stroke-width="12" stroke-linecap="round">
    <path d="M-46 30 A46 46 0 0 1 46 30" stroke="#ff6b6b"/>
    <path d="M-34 30 A34 34 0 0 1 34 30" stroke="#ffd93d"/>
    <path d="M-22 30 A22 22 0 0 1 22 30" stroke="#6bcb77"/>
  </g>

  <!-- cérebro (círculos) -->
  <g transform="translate(1065, 465)" fill="#ff8fab" opacity="0.9">
    <circle cx="-16" cy="-6" r="14"/>
    <circle cx="14" cy="-10" r="16"/>
    <circle cx="-6" cy="14" r="13"/>
    <circle cx="18" cy="14" r="12"/>
  </g>

  <!-- estrela grande -->
  <g transform="translate(1080, 270)">
    <path d="M0 -34 L10 -10 L36 -10 L16 6 L24 32 L0 16 L-24 32 L-16 6 L-36 -10 L-10 -10 Z" fill="#ffd93d" filter="url(#sombra-leve)"/>
  </g>

  <!-- controles de videogame -->
  <g transform="translate(115, 245)" filter="url(#sombra-leve)">
    <rect x="-42" y="-18" width="84" height="38" rx="19" fill="#2d3748"/>
    <circle cx="-22" cy="-1" r="5" fill="#ff6b9d"/>
    <rect x="-25" y="-4" width="6" height="14" rx="3" fill="#ffffff"/>
    <rect x="-29" y="0" width="14" height="6" rx="3" fill="#ffffff"/>
    <circle cx="18" cy="-6" r="4" fill="#6bcb77"/>
    <circle cx="28" cy="4" r="4" fill="#ffd93d"/>
  </g>

  <!-- rodapé -->
  <text x="600" y="605" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#ffffff" opacity="0.85">Acesso vitalício · Garantia de 7 dias · Progresso salvo</text>
</svg>
